<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>样板02 莫兰迪数据看板</title><style>*{box-sizing:border-box}body{margin:0;font-family:'Microsoft YaHei','PingFang SC',sans-serif}a{text-decoration:none}.wrap{max-width:980px;margin:0 auto;padding:24px 18px}.tag{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px}.foot{padding:22px;text-align:center;font-size:12px;opacity:.65}.demo{font-size:12px;text-align:center;padding:8px;opacity:.7}body{background:#F7F3EC;color:#2B2B2B}header{background:#1E4A5A;color:#fff;padding:30px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:12px;padding:18px}.lab{color:#6B7280;font-size:13px}.val{color:#1E4A5A;font-size:30px;font-weight:700}.bars{display:flex;align-items:flex-end;gap:22px;height:170px}.bar{flex:1;background:#2E6B7A;border-radius:6px 6px 0 0}.bar:last-child{background:#D97757}</style></head><body><div class="demo">样板 02 · 示例数据，交付时接买家的真实数据</div><header><div class="wrap"><h1 style="margin:0">经营数据看板</h1><p>价格每5秒刷新 · 每天自动更新分析</p></div></header><div class="wrap"><div class="grid">
<div class="card"><div class="lab">本月销售额</div><div class="val">13.5万</div><div class="lab">比上月 +5.5%</div></div>
<div class="card"><div class="lab">订单量</div><div class="val">3,590</div><div class="lab">每天都在涨</div></div>
<div class="card"><div class="lab">客单价</div><div class="val">38元</div><div class="lab">会员 1,200+</div></div></div>
<div class="card" style="margin-top:14px"><div class="lab">月度走势（万元）</div><div class="bars"><div class="bar" style="height:70px"></div><div class="bar" style="height:85px"></div><div class="bar" style="height:105px"></div><div class="bar" style="height:118px"></div><div class="bar" style="height:140px"></div><div class="bar" style="height:155px"></div></div></div></div><p class="foot">样板站 · 数据为示例</p></body></html>
